name: Research controls
on: [push, pull_request, workflow_dispatch]
jobs:
  offline-controls:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache/xdg
      ROBOT_AUDIT_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest --basetemp .cache/pytest-temp
      - run: python scripts/validate_artifacts.py
